name: Deploy to GitHub Pages

# Builds the static Vite site and publishes it to GitHub Pages on every push to
# main. Enable once under Settings → Pages → Build and deployment → Source:
# "GitHub Actions". The app uses a relative base path, so it serves correctly
# from the project subpath (https://<owner>.github.io/<repo>/).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # Requires Pages to be enabled once, by hand:
      # Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
      # (Auto-enablement via `enablement: true` is not possible here — the
      # workflow token is not permitted to create the Pages site.)
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
